<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RosaViva - Quiz Educativo Outubro Rosa</title>
    <meta name="description" content="Quiz educativo interativo e acessível sobre conscientização, prevenção e diagnóstico precoce do câncer de mama na campanha Outubro Rosa." />
    <meta property="og:title" content="RosaViva - Quiz Educativo Outubro Rosa" />
    <meta property="og:description" content="Quiz educativo interativo e acessível sobre conscientização, prevenção e diagnóstico precoce do câncer de mama na campanha Outubro Rosa." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/rosaviva-logo.png" type="image/png" />
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased selection:bg-pink-500 selection:text-white">
    <!-- SVG Color Blindness Filters Definition -->
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Protanopia (Red-blind) simulation / compensation filter -->
        <filter id="protanopia-filter">
          <feColorMatrix type="matrix" values="0.567, 0.433, 0, 0, 0
                                               0.558, 0.442, 0, 0, 0
                                               0, 0.242, 0.758, 0, 0
                                               0, 0, 0, 1, 0" />
        </filter>
        <!-- Deuteranopia (Green-blind) simulation / compensation filter -->
        <filter id="deuteranopia-filter">
          <feColorMatrix type="matrix" values="0.625, 0.375, 0, 0, 0
                                               0.70, 0.30, 0, 0, 0
                                               0, 0.30, 0.70, 0, 0
                                               0, 0, 0, 1, 0" />
        </filter>
        <!-- Tritanopia (Blue-blind) filter -->
        <filter id="tritanopia-filter">
          <feColorMatrix type="matrix" values="0.95, 0.05, 0, 0, 0
                                               0, 0.433, 0.567, 0, 0
                                               0, 0.475, 0.525, 0, 0
                                               0, 0, 0, 1, 0" />
        </filter>
        <!-- High Contrast filter -->
        <filter id="high-contrast-filter">
          <feComponentTransfer>
            <feFuncR type="linear" slope="1.3" intercept="-0.15" />
            <feFuncG type="linear" slope="1.3" intercept="-0.15" />
            <feFuncB type="linear" slope="1.3" intercept="-0.15" />
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>

    <!-- VLibras: Official Brazilian Sign Language Widget -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      window.addEventListener('load', function() {
        if (window.VLibras && window.VLibras.Widget) {
          try {
            new window.VLibras.Widget('https://vlibras.gov.br/app');
          } catch (e) {
            console.warn('VLibras initialized or already running:', e);
          }
        }
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
